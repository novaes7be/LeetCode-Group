name: Update Commit Count

on:
  push:
    branches:
      - master

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update commit count in README
        run: |
          COUNT=$(git rev-list --count HEAD)
          sed -i "s#<!-- COMMIT-COUNT -->.*#<!-- COMMIT-COUNT -->\`${COUNT}\` commits#" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Atualiza contador de commits"
          git push
